<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;

  background:
    radial-gradient(
      circle at 50% 45%,
      #64183d 0%,
      #26091e 42%,
      #05030a 100%
    );
}

/* =========================
   SCENE
========================= */

.scene {
  width: 100vw;
  height: 100vh;

  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;

  perspective: 1000px;
}

/* =========================
   STARS
========================= */

.star {
  position: absolute;

  width: 3px;
  height: 3px;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 0 10px white;

  opacity: .6;

  animation: twinkle
    var(--duration)
    ease-in-out
    infinite;
}

@keyframes twinkle {
  0%,100% {
    opacity: .15;
    transform: scale(.5);
  }

  50% {
    opacity: 1;
    transform: scale(1.5);
  }
}

/* =========================
   TITLE
========================= */

.hint {
  position: absolute;

  top: 12%;

  color: rgba(255,255,255,.8);

  font-size: 14px;

  letter-spacing: 2px;

  animation:
    hintMove 2s infinite;
}

@keyframes hintMove {
  50% {
    opacity: .35;
    transform: translateY(-5px);
  }
}

/* =========================
   ENVELOPE
========================= */

.envelope {
  width: min(330px, 80vw);
  height: 220px;

  position: relative;

  cursor: pointer;

  transform-style: preserve-3d;

  transition:
    transform .8s ease;

  filter:
    drop-shadow(
      0 25px 40px
      rgba(255,0,110,.35)
    );
}

.envelope:hover {
  transform: translateY(-8px);
}

/* =========================
   BACK
========================= */

.back {
  position: absolute;

  inset: 0;

  border-radius: 10px;

  background:
    linear-gradient(
      145deg,
      #ff4d83,
      #a80046
    );

  box-shadow:
    inset 0 0 30px
    rgba(255,255,255,.12),

    0 0 35px
    rgba(255,30,130,.35);
}

/* =========================
   LETTER
========================= */

.letter {
  position: absolute;

  width: 86%;
  height: 190px;

  left: 7%;
  bottom: 5px;

  z-index: 2;

  border-radius: 8px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #ffe8f0
    );

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  transition:
    transform 1s
    cubic-bezier(.2,.8,.2,1);
}

/* =========================
   HEART
========================= */

.heart {
  color: #ff176b;

  font-size: 45px;

  text-shadow:
    0 0 10px #ff176b,
    0 0 25px #ff4d91;

  animation:
    heartbeat 1s infinite;
}

@keyframes heartbeat {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.18);
  }
}

/* =========================
   I LOVE YOU
========================= */

.love {
  margin-top: 5px;

  font-size: 27px;

  font-weight: 900;

  letter-spacing: 3px;

  background:
    linear-gradient(
      90deg,
      #ff176b,
      #ff72a5,
      #d00055
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;
}

/* =========================
   LOVE MESSAGE
========================= */

.message {
  margin-top: 10px;

  color: #91435f;

  font-size: 12px;

  line-height: 1.7;

  letter-spacing: .4px;
}

/* =========================
   FLAP
========================= */

.flap {
  position: absolute;

  left: 0;
  top: 0;

  width: 0;
  height: 0;

  border-left:
    165px solid transparent;

  border-right:
    165px solid transparent;

  border-top:
    120px solid #ff5b8c;

  transform-origin: top;

  z-index: 5;

  transition:
    transform 1s
    cubic-bezier(.2,.8,.2,1);
}

/* =========================
   FRONT
========================= */

.front {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 115px;

  z-index: 4;

  border-radius:
    0 0 10px 10px;

  background:
    linear-gradient(
      145deg,
      #e92c67,
      #97003b
    );

  clip-path:
    polygon(
      0 0,
      50% 55%,
      100% 0,
      100% 100%,
      0 100%
    );
}

/* =========================
   SEAL
========================= */

.seal {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  width: 50px;
  height: 50px;

  z-index: 7;

  display: grid;

  place-items: center;

  border-radius: 50%;

  color: white;

  font-size: 23px;

  background:
    radial-gradient(
      circle,
      #ff78a6,
      #d80055
    );

  box-shadow:
    0 0 25px
    rgba(255,50,140,.9);

  transition:
    .5s;
}

/* =========================
   OPEN ANIMATION
========================= */

.envelope.open {
  transform:
    translateY(70px);
}

.envelope.open
.flap {
  transform:
    rotateX(180deg);

  z-index: 1;
}

.envelope.open
.letter {
  transform:
    translateY(-125px);
}

.envelope.open
.seal {
  opacity: 0;

  transform:
    translate(-50%,-50%)
    scale(0);
}

/* =========================
   PARTICLES
========================= */

#particles {
  position: absolute;

  inset: 0;

  pointer-events: none;
}

.particle {
  position: absolute;

  left: 50%;
  top: 48%;

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 0 10px #ff4d91,
    0 0 20px #ff176b;

  animation:
    explode 1.8s
    ease-out forwards;
}

@keyframes explode {

  from {
    transform:
      translate(0,0)
      scale(1);

    opacity: 1;
  }

  to {
    transform:
      translate(
        var(--moveX),
        var(--moveY)
      )
      scale(0);

    opacity: 0;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px) {

  .envelope {
    width: 80vw;
    height: 190px;
  }

  .flap {
    border-left-width: 40vw;
    border-right-width: 40vw;
    border-top-width: 105px;
  }

  .letter {
    height: 165px;
  }

  .love {
    font-size: 23px;
  }

  .message {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="hint">
    Tap the envelope 💌
  </div>

  <div
    class="envelope"
    id="envelope"
  >

    <div class="back"></div>

    <div class="letter">

      <div class="heart">
        ♥
      </div>

      <div class="love">
        I LOVE YOU
      </div>

      <p class="message">
        In a world full of moments,<br>
        you are my favorite one. ❤️
      </p>

    </div>

    <div class="flap"></div>

    <div class="front"></div>

    <div class="seal">
      ♥
    </div>

  </div>

  <div id="particles"></div>

</div>


<script>

/* =========================
   STARS
========================= */

const scene =
  document.querySelector(".scene");

for(let i = 0; i < 45; i++){

  const star =
    document.createElement("div");

  star.className = "star";

  star.style.left =
    Math.random() * 100 + "%";

  star.style.top =
    Math.random() * 100 + "%";

  star.style.setProperty(
    "--duration",
    (1.5 + Math.random() * 3) + "s"
  );

  scene.appendChild(star);
}


/* =========================
   ELEMENTS
========================= */

const envelope =
  document.getElementById("envelope");

const particles =
  document.getElementById("particles");

let opened = false;


/* =========================
   SOUND
========================= */

function playSound(){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const audio =
    new AudioContext();

  const notes = [
    523.25,
    659.25,
    783.99
  ];

  notes.forEach(
    (frequency,index)=>{

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.value =
        frequency;

      const start =
        audio.currentTime +
        index * .12;

      gain.gain.setValueAtTime(
        0,
        start
      );

      gain.gain.linearRampToValueAtTime(
        .07,
        start + .04
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        start + .8
      );

      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );

      oscillator.start(start);

      oscillator.stop(
        start + .8
      );

    }
  );
}


/* =========================
   PARTICLES
========================= */

function createParticles(){

  for(let i = 0; i < 70; i++){

    const particle =
      document.createElement("div");

    particle.className =
      "particle";

    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      120 +
      Math.random() * 280;

    const x =
      Math.cos(angle) *
      distance;

    const y =
      Math.sin(angle) *
      distance;

    particle.style.setProperty(
      "--moveX",
      x + "px"
    );

    particle.style.setProperty(
      "--moveY",
      y + "px"
    );

    const size =
      2 + Math.random() * 6;

    particle.style.width =
      size + "px";

    particle.style.height =
      size + "px";

    particle.style.animationDelay =
      Math.random() * .35 + "s";

    particles.appendChild(
      particle
    );

    setTimeout(
      ()=>{
        particle.remove();
      },
      2200
    );
  }
}


/* =========================
   OPEN ENVELOPE
========================= */

function openEnvelope(){

  if(opened) return;

  opened = true;

  envelope.classList.add(
    "open"
  );

  playSound();

  createParticles();
}


/* =========================
   CLICK
========================= */

envelope.addEventListener(
  "click",
  openEnvelope
);


/* =========================
   TOUCH
========================= */

envelope.addEventListener(
  "touchstart",
  openEnvelope,
  { passive:true }
);

</script>

</body>
</html>

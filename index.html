<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>For You ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 45%,#35112f 0%,#16091d 45%,#05030a 100%);
  color:white;
}

.scene{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* BACKGROUND */

.glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,50,130,.16);
  filter:blur(90px);
  animation:glowMove 5s ease-in-out infinite alternate;
}

@keyframes glowMove{
  from{transform:scale(.85);}
  to{transform:scale(1.2);}
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15;transform:scale(.7);}
  to{opacity:1;transform:scale(1.4);}
}

/* MAIN */

.main{
  position:relative;
  z-index:10;
  width:100%;
  max-width:1000px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:80px;
  padding:25px;
}

/* ENVELOPE */

.envelopeArea{
  position:relative;
  width:330px;
  height:260px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.envelope{
  position:relative;
  width:300px;
  height:190px;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform .5s ease;
  filter:drop-shadow(0 25px 30px rgba(0,0,0,.5));
}

.envelope:hover{
  transform:translateY(-7px);
}

.back{
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,#ff4b8b,#b91e59);
  border-radius:8px;
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.15),
    0 0 30px rgba(255,50,130,.2);
}

/* LETTER */

.letter{
  position:absolute;
  left:18px;
  right:18px;
  top:10px;
  height:155px;
  background:linear-gradient(145deg,#fff,#ffe8f1);
  border-radius:5px;
  z-index:2;
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.letterHeart{
  color:#e92369;
  font-size:42px;
  animation:heartBeat 1.1s infinite;
}

@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.2)}
}

/* FLAP */

.flap{
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-top:100px solid #ff6097;
  transform-origin:top center;
  z-index:5;
  transition:transform 1s cubic-bezier(.2,.8,.2,1);
  filter:brightness(.95);
}

/* FRONT */

.front{
  position:absolute;
  bottom:0;
  left:0;
  width:0;
  height:0;
  border-left:150px solid #d92867;
  border-right:150px solid #d92867;
  border-top:95px solid transparent;
  border-bottom:0 solid transparent;
  z-index:4;
}

/* SEAL */

.seal{
  position:absolute;
  z-index:7;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:55px;
  height:55px;
  border-radius:50%;
  background:radial-gradient(circle,#ff7eae,#d7195c);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:
    0 0 0 5px rgba(255,255,255,.12),
    0 0 25px rgba(255,50,130,.7);
  transition:opacity .4s,transform .6s;
}

/* OPEN */

.envelope.open .flap{
  transform:rotateX(180deg);
  z-index:1;
}

.envelope.open .letter{
  transform:translateY(-135px);
  z-index:6;
}

.envelope.open .seal{
  opacity:0;
  transform:translate(-50%,-50%) scale(.5);
}

/* GLOW */

.envelopeGlow{
  position:absolute;
  width:280px;
  height:80px;
  bottom:10px;
  background:rgba(255,30,110,.35);
  filter:blur(40px);
  opacity:.6;
  animation:envelopeGlow 2s infinite alternate;
}

@keyframes envelopeGlow{
  from{opacity:.35;transform:scale(.8)}
  to{opacity:.75;transform:scale(1.1)}
}

/* HINT */

.hint{
  position:absolute;
  top:7%;
  z-index:20;
  font-size:14px;
  letter-spacing:3px;
  color:#ffd4e4;
  animation:hintPulse 2s infinite;
}

@keyframes hintPulse{
  0%,100%{opacity:.45}
  50%{opacity:1}
}

/* SIDE MESSAGE */

.sideMessage{
  width:330px;
  text-align:center;
  opacity:0;
  transform:translateX(60px) scale(.9);
  transition:1s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}

.sideMessage.show{
  opacity:1;
  transform:translateX(0) scale(1);
}

.sideHeart{
  font-size:45px;
  color:#ff4d91;
  text-shadow:0 0 25px #ff2974;
  animation:heartBeat 1.2s infinite;
}

.sideTitle{
  margin-top:12px;
  font-size:32px;
  font-weight:bold;
  letter-spacing:4px;
  color:#fff;
  text-shadow:
    0 0 10px #ff4d91,
    0 0 25px #ff176b;
}

.line{
  width:90px;
  height:2px;
  background:#ff4d91;
  margin:18px auto;
  box-shadow:0 0 10px #ff4d91;
}

.sideText{
  color:#ffd9e7;
  line-height:1.8;
  font-size:16px;
}

/* PARTICLES */

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#ff76ad;
  pointer-events:none;
  animation:particleMove 2s ease-out forwards;
  box-shadow:0 0 12px #ff3c83;
}

@keyframes particleMove{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }

  100%{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* FLOATING HEARTS */

.floatHeart{
  position:absolute;
  color:#ff4f94;
  font-size:20px;
  pointer-events:none;
  animation:floatUp 4s ease-out forwards;
  text-shadow:0 0 15px #ff2170;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(.4) rotate(0);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:translateY(-350px) scale(1.4) rotate(25deg);
    opacity:0;
  }
}

/* QUESTION SCREEN */

.questionScreen{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at center,
    rgba(90,15,55,.97),
    rgba(5,2,10,.99));
  opacity:0;
  pointer-events:none;
  transform:scale(1.08);
  transition:1s ease;
}

.questionScreen.show{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
}

.questionBox{
  width:min(90%,520px);
  text-align:center;
  padding:35px 25px;
  border:1px solid rgba(255,120,170,.25);
  border-radius:25px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(15px);
  box-shadow:
    0 0 50px rgba(255,30,120,.15),
    inset 0 0 30px rgba(255,255,255,.03);
}

.questionHeart{
  font-size:65px;
  animation:heartBeat 1.2s infinite;
  margin-bottom:15px;
}

.questionTitle{
  font-size:28px;
  line-height:1.5;
  color:#fff;
  text-shadow:0 0 15px rgba(255,80,140,.8);
}

.questionSub{
  margin-top:12px;
  color:#ffc9dc;
  font-size:14px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:30px;
  flex-wrap:wrap;
}

.answer{
  border:none;
  padding:14px 28px;
  border-radius:50px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.noBtn{
  background:linear-gradient(135deg,#ff397d,#d7195b);
  color:white;
  box-shadow:0 0 20px rgba(255,40,110,.35);
}

.yesBtn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  color:#ffd8e6;
}

.answer:active{
  transform:scale(.93);
}

.answer:hover{
  transform:translateY(-3px) scale(1.03);
}

.result{
  margin-top:25px;
  min-height:30px;
  color:#fff;
  font-size:18px;
  line-height:1.7;
}

/* RESPONSIVE */

@media(max-width:700px){

  .main{
    flex-direction:column;
    gap:30px;
    padding-top:70px;
  }

  .envelopeArea{
    transform:scale(.78);
    margin-bottom:-35px;
  }

  .sideMessage{
    width:90%;
    transform:translateY(30px);
  }

  .sideMessage.show{
    transform:translateY(0);
  }

  .sideTitle{
    font-size:25px;
  }

  .sideText{
    font-size:14px;
  }

  .hint{
    top:3%;
    font-size:11px;
  }

  .questionTitle{
    font-size:23px;
  }

  .questionBox{
    padding:30px 18px;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="glow"></div>

  <div class="hint">
    TAP THE ENVELOPE 💌
  </div>

  <div class="main">

    <div class="envelopeArea">

      <div class="envelope" id="envelope">

        <div class="back"></div>

        <div class="letter">
          <div class="letterHeart">♥</div>
        </div>

        <div class="flap"></div>

        <div class="front"></div>

        <div class="seal">
          ♥
        </div>

      </div>

      <div class="envelopeGlow"></div>

    </div>

    <div class="sideMessage" id="sideMessage">

      <div class="sideHeart">
        ♥
      </div>

      <div class="sideTitle">
        I LOVE YOU
      </div>

      <div class="line"></div>

      <div class="sideText">
        In a world full of moments,<br>
        you are my favorite one.<br>
        Every little moment with you<br>
        feels like something magical. ✨
      </div>

    </div>

  </div>

  <div id="particles"></div>

  <!-- QUESTION -->

  <div class="questionScreen" id="questionScreen">

    <div class="questionBox">

      <div class="questionHeart">
        ❤️
      </div>

      <div class="questionTitle">
        واش ندمتي على معرفتي؟
      </div>

      <div class="questionSub">
        جاوبي بصراحة... ولكن بلا كذوب 😌❤️
      </div>

      <div class="buttons">

        <button class="answer noBtn" id="noBtn">
          لا ❤️
        </button>

        <button class="answer yesBtn" id="yesBtn">
          نعم 😢
        </button>

      </div>

      <div class="result" id="result"></div>

    </div>

  </div>

</div>


<script>

/* =========================
   STARS
========================= */

const scene = document.querySelector(".scene");

for(let i=0;i<80;i++){

  const star = document.createElement("div");

  star.className = "star";

  star.style.left = Math.random()*100 + "%";
  star.style.top = Math.random()*100 + "%";

  star.style.animationDelay =
    Math.random()*3 + "s";

  star.style.transform =
    `scale(${Math.random()*1.5+.5})`;

  scene.appendChild(star);
}


/* =========================
   ELEMENTS
========================= */

const envelope =
  document.getElementById("envelope");

const sideMessage =
  document.getElementById("sideMessage");

const particles =
  document.getElementById("particles");

const questionScreen =
  document.getElementById("questionScreen");

const noBtn =
  document.getElementById("noBtn");

const yesBtn =
  document.getElementById("yesBtn");

const result =
  document.getElementById("result");

let opened = false;


/* =========================
   ROMANTIC SOUND
========================= */

function playSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioContext();

    const notes = [
      523.25,
      659.25,
      783.99,
      1046.50
    ];

    notes.forEach((frequency,index)=>{

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.type = "sine";

      oscillator.frequency.value =
        frequency;

      oscillator.connect(gain);

      gain.connect(audio.destination);

      const start =
        audio.currentTime + index*.22;

      const end =
        start + .5;

      gain.gain.setValueAtTime(
        0,
        start
      );

      gain.gain.linearRampToValueAtTime(
        .08,
        start+.04
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        end
      );

      oscillator.start(start);

      oscillator.stop(end);

    });

  }catch(e){

    console.log("Audio not supported");

  }

}


/* =========================
   PARTICLES
========================= */

function createParticles(){

  for(let i=0;i<100;i++){

    const p =
      document.createElement("div");

    p.className = "particle";

    const x =
      (Math.random()-.5)*500;

    const y =
      (Math.random()-.5)*400;

    p.style.left = "50%";
    p.style.top = "50%";

    p.style.setProperty(
      "--x",
      x+"px"
    );

    p.style.setProperty(
      "--y",
      y+"px"
    );

    p.style.animationDelay =
      Math.random()*.5+"s";

    particles.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },2500);

  }

}


/* =========================
   FLOATING HEARTS
========================= */

function createHearts(){

  for(let i=0;i<25;i++){

    const heart =
      document.createElement("div");

    heart.className =
      "floatHeart";

    heart.innerHTML =
      Math.random()>.5
      ? "❤️"
      : "💗";

    heart.style.left =
      (35+Math.random()*30)+"%";

    heart.style.top =
      (55+Math.random()*20)+"%";

    heart.style.fontSize =
      (15+Math.random()*22)+"px";

    heart.style.animationDelay =
      Math.random()*1.5+"s";

    scene.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },5500);

  }

}


/* =========================
   OPEN ENVELOPE
========================= */

function openEnvelope(){

  if(opened) return;

  opened = true;

  envelope.classList.add("open");

  playSound();

  createParticles();

  createHearts();

  setTimeout(()=>{

    sideMessage.classList.add("show");

  },700);

  setTimeout(()=>{

    questionScreen.classList.add("show");

  },5000);

}


/* =========================
   CLICK + TOUCH
========================= */

envelope.addEventListener(
  "click",
  openEnvelope
);

envelope.addEventListener(
  "touchstart",
  openEnvelope,
  {passive:true}
);


/* =========================
   NO ❤️
========================= */

noBtn.addEventListener(
  "click",
  ()=>{

    result.innerHTML =
      "كنت عارف الجواب ديالك 😌❤️<br>" +
      "وأنا حتى أنا ما ندمتش على معرفتك.";

    createParticles();

    createHearts();

    playSound();

  }
);


/* =========================
   YES 😢
========================= */

yesBtn.addEventListener(
  "click",
  ()=>{

    result.innerHTML =
      "حتى إلا قلتي نعم... 😢<br>" +
      "غادي نبقى كنعتبر معرفتك من أجمل الحوايج اللي وقعات ليا. ❤️";

    playSound();

  }
);

</script>

</body>
</html>

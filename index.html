<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>For You ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 45%,
      #781d4b 0%,
      #320d27 35%,
      #100511 70%,
      #030207 100%);
  color:white;
}

/* =========================
   SCENE
========================= */

.scene{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* glow خلفية */

.scene::before{
  content:"";
  position:absolute;

  width:500px;
  height:500px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#ff176b;

  filter:blur(150px);

  opacity:.12;

  animation:
    backgroundGlow 4s ease-in-out infinite;
}

@keyframes backgroundGlow{

  0%,100%{
    transform:translate(-50%,-50%) scale(.8);
    opacity:.08;
  }

  50%{
    transform:translate(-50%,-50%) scale(1.2);
    opacity:.2;
  }
}

/* =========================
   STARS
========================= */

.star{
  position:absolute;

  width:3px;
  height:3px;

  background:white;
  border-radius:50%;

  box-shadow:
    0 0 8px white,
    0 0 15px #ff80b0;

  animation:
    twinkle var(--speed) infinite ease-in-out;
}

@keyframes twinkle{

  0%,100%{
    opacity:.1;
    transform:scale(.5);
  }

  50%{
    opacity:1;
    transform:scale(1.5);
  }
}

/* =========================
   HINT
========================= */

.hint{
  position:absolute;

  top:10%;

  font-size:14px;
  letter-spacing:3px;

  color:rgba(255,255,255,.75);

  animation:
    hint 2s infinite;
}

@keyframes hint{

  50%{
    opacity:.3;
    transform:translateY(-5px);
  }
}

/* =========================
   MAIN
========================= */

.main{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:70px;

  z-index:5;
}

/* =========================
   ENVELOPE AREA
========================= */

.envelopeArea{
  position:relative;

  width:330px;
  height:250px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* glow تحت الظرف */

.envelopeGlow{
  position:absolute;

  width:300px;
  height:100px;

  bottom:5px;

  border-radius:50%;

  background:#ff176b;

  filter:blur(45px);

  opacity:.3;

  transition:1s;
}

.envelope.open ~ .envelopeGlow{
  opacity:.8;
}

/* =========================
   ENVELOPE
========================= */

.envelope{
  position:relative;

  width:min(330px,80vw);
  height:220px;

  cursor:pointer;

  transform-style:preserve-3d;

  transition:
    transform .8s ease;

  filter:
    drop-shadow(
      0 25px 35px
      rgba(255,0,100,.4)
    );
}

.envelope:hover{
  transform:translateY(-8px);
}

/* =========================
   BACK
========================= */

.back{
  position:absolute;
  inset:0;

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      #ff5288,
      #b1004d
    );

  box-shadow:
    inset 0 0 30px
    rgba(255,255,255,.15);
}

/* =========================
   LETTER
========================= */

.letter{
  position:absolute;

  width:86%;
  height:190px;

  left:7%;
  bottom:5px;

  z-index:2;

  border-radius:8px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #ffe6ef
    );

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.3);

  transition:
    transform 1s
    cubic-bezier(.2,.8,.2,1);
}

/* قلب الورقة */

.letterHeart{
  font-size:55px;

  color:#ff176b;

  text-shadow:
    0 0 15px #ff176b,
    0 0 35px #ff4d91;

  animation:
    heartbeat 1s infinite;
}

@keyframes heartbeat{

  50%{
    transform:scale(1.2);
  }
}

/* =========================
   FLAP
========================= */

.flap{
  position:absolute;

  top:0;
  left:0;

  width:0;
  height:0;

  border-left:165px solid transparent;
  border-right:165px solid transparent;
  border-top:120px solid #ff6491;

  transform-origin:top;

  z-index:6;

  transition:
    transform 1s
    cubic-bezier(.2,.8,.2,1);
}

/* =========================
   FRONT
========================= */

.front{
  position:absolute;

  bottom:0;
  left:0;

  width:100%;
  height:115px;

  z-index:4;

  border-radius:
    0 0 10px 10px;

  background:
    linear-gradient(
      145deg,
      #ec326b,
      #98003c
    );

  clip-path:
    polygon(
      0 0,
      50% 55%,
      100% 0,
      100% 100%,
      0 100%
    );
}

/* =========================
   SEAL
========================= */

.seal{
  position:absolute;

  z-index:8;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:52px;
  height:52px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:
    radial-gradient(
      circle,
      #ff8bb1,
      #d80055
    );

  color:white;

  font-size:25px;

  box-shadow:
    0 0 20px #ff176b,
    0 0 40px rgba(255,20,110,.8);

  transition:.5s;
}

/* =========================
   OPEN
========================= */

.envelope.open{
  transform:translateY(70px);
}

.envelope.open .flap{
  transform:rotateX(180deg);

  z-index:1;
}

.envelope.open .letter{
  transform:translateY(-125px);
}

.envelope.open .seal{
  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(0);
}

/* =========================
   SIDE MESSAGE
========================= */

.sideMessage{
  width:260px;

  opacity:0;

  transform:
    translateX(40px);

  transition:
    opacity 1.5s ease,
    transform 1.5s ease;

  pointer-events:none;
}

.sideMessage.show{
  opacity:1;

  transform:
    translateX(0);
}

.sideHeart{
  font-size:35px;

  color:#ff4c8b;

  text-shadow:
    0 0 15px #ff176b,
    0 0 30px #ff176b;

  margin-bottom:15px;

  animation:
    heartbeat 1.2s infinite;
}

.sideTitle{
  font-size:32px;

  font-weight:900;

  letter-spacing:3px;

  background:
    linear-gradient(
      90deg,
      #ff3f80,
      #ff9abb,
      #ff176b
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.sideText{
  margin-top:15px;

  color:rgba(255,255,255,.8);

  font-size:14px;

  line-height:1.9;
}

.line{
  width:70px;
  height:2px;

  margin:18px 0;

  background:
    linear-gradient(
      90deg,
      #ff176b,
      transparent
    );

  box-shadow:
    0 0 10px #ff176b;
}

/* =========================
   PARTICLES
========================= */

#particles{
  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:20;
}

.particle{
  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 8px white,
    0 0 18px #ff176b;

  animation:
    particleFly 1.8s
    ease-out forwards;
}

@keyframes particleFly{

  from{
    transform:
      translate(0,0)
      scale(1);

    opacity:1;
  }

  to{
    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(0);

    opacity:0;
  }
}

/* =========================
   FLOATING HEARTS
========================= */

.floatingHeart{
  position:absolute;

  left:50%;
  top:50%;

  color:#ff4f8c;

  font-size:
    var(--size);

  text-shadow:
    0 0 10px #ff176b,
    0 0 25px #ff176b;

  animation:
    heartFly 2.5s ease-out forwards;
}

@keyframes heartFly{

  from{
    transform:
      translate(-50%,-50%)
      scale(.4)
      rotate(0);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  to{
    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(1)
      rotate(25deg);

    opacity:0;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .main{
    flex-direction:column;

    gap:25px;
  }

  .envelopeArea{
    height:220px;
  }

  .sideMessage{
    position:absolute;

    top:calc(100% + 15px);

    width:85vw;

    text-align:center;

    transform:
      translateY(20px);
  }

  .sideMessage.show{
    transform:
      translateY(0);
  }

  .sideTitle{
    font-size:25px;
  }

  .sideText{
    font-size:12px;
  }

  .line{
    margin:12px auto;
  }

  .hint{
    top:7%;
  }

  .envelope{
    width:80vw;
    height:190px;
  }

  .flap{
    border-left-width:40vw;
    border-right-width:40vw;
    border-top-width:105px;
  }

  .letter{
    height:165px;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="hint">
    TAP THE ENVELOPE 💌
  </div>

  <div class="main">

    <div class="envelopeArea">

      <div class="envelope" id="envelope">

        <div class="back"></div>

        <div class="letter">
          <div class="letterHeart">♥</div>
        </div>

        <div class="flap"></div>

        <div class="front"></div>

        <div class="seal">♥</div>

      </div>

      <div class="envelopeGlow"></div>

    </div>


    <!-- النص في الجنب -->

    <div class="sideMessage" id="sideMessage">

      <div class="sideHeart">
        ♥
      </div>

      <div class="sideTitle">
        I LOVE YOU
      </div>

      <div class="line"></div>

      <div class="sideText">
        In a world full of moments,<br>
        you are my favorite one.<br>
        Every little moment with you<br>
        feels like something magical. ✨
      </div>

    </div>

  </div>

  <div id="particles"></div>

</div>


<script>

/* =========================
   STARS
========================= */

const scene =
  document.querySelector(".scene");

for(let i=0;i<55;i++){

  const star =
    document.createElement("div");

  star.className="star";

  star.style.left =
    Math.random()*100+"%";

  star.style.top =
    Math.random()*100+"%";

  star.style.setProperty(
    "--speed",
    (1.5+Math.random()*3)+"s"
  );

  scene.appendChild(star);
}


/* =========================
   ELEMENTS
========================= */

const envelope =
  document.getElementById("envelope");

const sideMessage =
  document.getElementById("sideMessage");

const particles =
  document.getElementById("particles");

let opened=false;


/* =========================
   ROMANTIC SOUND
========================= */

function playSound(){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const audio =
    new AudioContext();

  /*
    3 نغمات خفيفة
    باش يعطي إحساس رومانسي
  */

  const notes=[
    523.25,
    659.25,
    783.99,
    1046.50
  ];

  notes.forEach(
    (frequency,index)=>{

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.type="sine";

      oscillator.frequency.value=
        frequency;

      const start=
        audio.currentTime+
        index*.13;

      gain.gain.setValueAtTime(
        0,
        start
      );

      gain.gain.linearRampToValueAtTime(
        .06,
        start+.04
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        start+.9
      );

      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );

      oscillator.start(start);

      oscillator.stop(
        start+.9
      );
    }
  );
}


/* =========================
   PARTICLES
========================= */

function createParticles(){

  for(let i=0;i<90;i++){

    const p =
      document.createElement("div");

    p.className="particle";

    const angle =
      Math.random()*
      Math.PI*2;

    const distance =
      100+
      Math.random()*350;

    p.style.setProperty(
      "--x",
      Math.cos(angle)*
      distance+"px"
    );

    p.style.setProperty(
      "--y",
      Math.sin(angle)*
      distance+"px"
    );

    const size=
      2+
      Math.random()*6;

    p.style.width=
      size+"px";

    p.style.height=
      size+"px";

    p.style.animationDelay=
      Math.random()*.45+"s";

    particles.appendChild(p);

    setTimeout(
      ()=>{
        p.remove();
      },
      2500
    );
  }
}


/* =========================
   HEARTS
========================= */

function createHearts(){

  for(let i=0;i<18;i++){

    const heart =
      document.createElement("div");

    heart.className=
      "floatingHeart";

    heart.innerHTML="♥";

    const angle =
      Math.random()*
      Math.PI*2;

    const distance =
      100+
      Math.random()*300;

    heart.style.setProperty(
      "--x",
      Math.cos(angle)*
      distance+"px"
    );

    heart.style.setProperty(
      "--y",
      Math.sin(angle)*
      distance+"px"
    );

    heart.style.setProperty(
      "--size",
      (10+Math.random()*20)+"px"
    );

    heart.style.animationDelay=
      Math.random()*.7+"s";

    particles.appendChild(
      heart
    );

    setTimeout(
      ()=>{
        heart.remove();
      },
      3300
    );
  }
}


/* =========================
   OPEN
========================= */

function openEnvelope(){

  if(opened) return;

  opened=true;

  envelope.classList.add(
    "open"
  );

  setTimeout(
    ()=>{
      sideMessage.classList.add(
        "show"
      );
    },
    700
  );

  playSound();

  createParticles();

  createHearts();
}


/* =========================
   CLICK
========================= */

envelope.addEventListener(
  "click",
  openEnvelope
);


/* =========================
   TOUCH
========================= */

envelope.addEventListener(
  "touchstart",
  openEnvelope,
  {
    passive:true
  }
);

</script>

</body>
</html>
